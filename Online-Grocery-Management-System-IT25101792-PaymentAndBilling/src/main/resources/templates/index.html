<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FreshCart Online Grocery</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 28px 16px;
            background: #f6f8fa;
            color: #263238;
            font-family: Arial, sans-serif;
            font-size: 13px;
        }

        .container {
            width: min(610px, 100%);
            margin: 0 auto;
        }

        header {
            margin-bottom: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 5px;
            color: #087f57;
            font-size: 22px;
        }

        .subtitle {
            color: #68757d;
            font-size: 11px;
        }

        .card {
            margin-bottom: 18px;
            padding: 16px;
            background: #fff;
            border: 1px solid #e1e6e9;
            border-radius: 7px;
            box-shadow: 0 2px 6px rgba(22, 33, 43, 0.05);
        }

        h2 {
            margin: 0 0 12px;
            font-size: 15px;
            font-weight: 600;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        input,
        select {
            width: 100%;
            min-width: 0;
            padding: 9px;
            border: 1px solid #cbd2d6;
            border-radius: 4px;
            background: white;
            font-size: 12px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        button {
            grid-column: 1 / -1;
            padding: 10px;
            border: 0;
            border-radius: 4px;
            background: #07966a;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #067d59;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            font-size: 11px;
        }

        th,
        td {
            padding: 9px 7px;
            border-bottom: 1px solid #e5e9eb;
            text-align: left;
        }

        th {
            background: #f1f4f5;
            color: #46535a;
            font-size: 10px;
            text-transform: uppercase;
        }

        .delete-link {
            color: #b42318;
        }

        .empty-message {
            color: #68757d;
            text-align: center;
        }

        @media (max-width: 480px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width,
            button {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <header>
        <h1>🛒 FreshCart Online Grocery</h1>
        <div class="subtitle">Payment &amp; Billing Module</div>
    </header>

    <section class="card">
        <h2>Add New Payment Record</h2>

        <form class="form-grid" action="/payments/save" method="post">
            <input
                    type="text"
                    name="paymentId"
                    placeholder="Payment ID (e.g. PAY-001)"
                    required>

            <input
                    type="text"
                    name="orderId"
                    placeholder="Order ID (e.g. ORD-001)"
                    required>

            <input
                    type="text"
                    name="customerName"
                    placeholder="Customer Name"
                    required>

            <input
                    type="tel"
                    name="phoneNumber"
                    placeholder="Phone Number">

            <input
                    class="full-width"
                    type="text"
                    name="items"
                    placeholder="Items Summary (e.g. Milk, Rice, ...)">

            <input
                    type="number"
                    name="amount"
                    step="0.01"
                    min="0"
                    placeholder="Amount ($)"
                    required>

            <select name="paymentMethod" required>
                <option value="">Select Payment Method</option>
                <option value="Cash on Delivery">Cash on Delivery</option>
                <option value="Card">Card</option>
                <option value="Online Banking">Online Banking</option>
            </select>

            <input
                    type="date"
                    name="paymentDate"
                    aria-label="Payment date">

            <button type="submit">Save Payment to File</button>
        </form>
    </section>

    <section class="card">
        <h2>Stored Payment Records <span style="font-weight: normal;">(from payment.txt)</span></h2>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Payment ID</th>
                    <th>Customer</th>
                    <th>Phone</th>
                    <th>Amount</th>
                    <th>Method</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="payment : ${paymentRecords}">
                    <td th:text="${payment.paymentId}">PAY-001</td>
                    <td th:text="${payment.customerName}">Customer</td>
                    <td th:text="${payment.phoneNumber}">Phone</td>
                    <td th:text="${payment.amount}">0.00</td>
                    <td th:text="${payment.paymentMethod}">Method</td>
                    <td>
                        <a class="delete-link"
                           th:href="@{/payments/delete(id=${payment.paymentId})}"
                           onclick="return confirm('Delete this payment record?')">
                            Delete
                        </a>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(paymentRecords)}">
                    <td class="empty-message" colspan="6">
                        No payment records yet.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

</div>
</body>
</html>
