<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mymart - Delivery Management System</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --brand-green: #10b981;
            --brand-green-dark: #059669;
            --brand-green-light: #ecfdf5;
        }

        body {
            background-color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #334155;
        }

        .navbar-brand-custom {
            color: var(--brand-green);
            font-weight: 800;
            font-size: 1.6rem;
            letter-spacing: -0.5px;
        }

        .header-bg {
            background: linear-gradient(135deg, #064e3b 0%, #10b981 100%);
            color: white;
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.25);
        }

        .card-stat {
            border: none;
            border-radius: 0.85rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card-stat:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08) !important;
        }

        .icon-box {
            width: 48px;
            height: 48px;
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }

        /* Delivery Status Colors */
        .badge-pending {
            background-color: #fef3c7 !important;
            color: #92400e !important;
            border: 1px solid #fde68a;
        }

        .badge-dispatched {
            background-color: #ffedd5 !important;
            color: #c2410c !important;
            border: 1px solid #fed7aa;
        }

        .badge-out_for_delivery {
            background-color: #dbeafe !important;
            color: #1e40af !important;
            border: 1px solid #bfdbfe;
        }

        .badge-delivered {
            background-color: #d1fae5 !important;
            color: #065f46 !important;
            border: 1px solid #a7f3d0;
        }

        .badge-cancelled {
            background-color: #fee2e2 !important;
            color: #991b1b !important;
            border: 1px solid #fecaca;
        }

        /* Table Styling */
        .table-custom {
            border-collapse: separate;
            border-spacing: 0 0.5rem;
        }

        .table-custom tbody tr {
            background-color: white;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
            transition: background-color 0.15s ease;
        }

        .table-custom tbody tr:hover {
            background-color: #f1f5f9;
        }

        .table-custom td {
            vertical-align: middle;
            border: none;
            padding: 1rem 0.75rem;
        }

        .table-custom td:first-child {
            border-top-left-radius: 0.5rem;
            border-bottom-left-radius: 0.5rem;
        }

        .table-custom td:last-child {
            border-top-right-radius: 0.5rem;
            border-bottom-right-radius: 0.5rem;
        }

        /* Buttons and Forms */
        .btn-brand {
            background-color: var(--brand-green);
            color: white;
            font-weight: 600;
            border: none;
        }

        .btn-brand:hover {
            background-color: var(--brand-green-dark);
            color: white;
        }

        .search-box {
            width: min(100%, 360px);
        }

        .form-select-sm-custom {
            border-radius: 0.375rem;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
        }

        @media (max-width: 576px) {
            .header-bg {
                padding: 1.25rem;
            }

            .header-bg h2 {
                font-size: 1.25rem;
            }

            .search-box {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top py-3">
    <div class="container">
        <a class="navbar-brand navbar-brand-custom d-flex align-items-center gap-2" href="#">
            <i class="fa-solid fa-cart-shopping text-success"></i>
            mymart
        </a>
        <span class="badge bg-light text-success border border-success-subtle px-3 py-2 rounded-pill">
            <i class="fa-solid fa-truck-fast me-1"></i>
            Delivery Management System
        </span>
    </div>
</nav>

<div class="container my-4">

    <!-- Success Message -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fa-solid fa-circle-check me-2"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Error Message -->
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="fa-solid fa-circle-exclamation me-2"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Dashboard Header -->
    <div class="header-bg mb-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
        <div>
            <h2 class="fw-bold mb-0">
                <i class="fa-solid fa-boxes-packing me-2"></i>
                Delivery Operations Dashboard
            </h2>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-brand px-4 py-2 shadow-sm" data-bs-toggle="modal" data-bs-target="#addDeliveryModal">
                <i class="fa-solid fa-plus me-2"></i>Add New Delivery
            </button>
            <button class="btn btn-light text-success fw-bold px-4 py-2 shadow-sm" onclick="window.location.reload();">
                <i class="fa-solid fa-rotate-right me-2"></i>Refresh
            </button>
        </div>
    </div>

    <!-- Dashboard Statistics -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
            <div class="card card-stat shadow-sm p-3 bg-white">
                <div class="d-flex align-items-center justify-content-between">
                    <div>
                        <div class="text-muted small fw-semibold text-uppercase">Total Deliveries</div>
                        <div class="fs-4 fw-bold mt-1" th:text="${deliveries != null ? deliveries.size() : 0}">0</div>
                    </div>
                    <div class="icon-box bg-light text-secondary">
                        <i class="fa-solid fa-receipt"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-6 col-md-3">
            <div class="card card-stat shadow-sm p-3 bg-white">
                <div class="d-flex align-items-center justify-content-between">
                    <div>
                        <div class="text-muted small fw-semibold text-uppercase">Pending</div>
                        <div class="fs-4 fw-bold text-warning mt-1" th:text="${deliveries != null ? #lists.size(deliveries.?[deliveryStatus != null and (deliveryStatus.equalsIgnoreCase('Pending') or deliveryStatus.equalsIgnoreCase('PENDING'))]) : 0}">0</div>
                    </div>
                    <div class="icon-box bg-warning-subtle text-warning">
                        <i class="fa-solid fa-clock"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-6 col-md-3">
            <div class="card card-stat shadow-sm p-3 bg-white">
                <div class="d-flex align-items-center justify-content-between">
                    <div>
                        <div class="text-muted small fw-semibold text-uppercase">Out for Delivery</div>
                        <div class="fs-4 fw-bold text-primary
