
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration</title>

    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="main-header">
    <div class="header-container">
        <a href="/" class="brand">
            <span class="brand-name">FreshMart</span>
            <span class="brand-tagline">Fresh groceries, delivered</span>
        </a>
    </div>
</header>

<main class="page-section">
    <div class="panel" style="max-width: 500px; margin: 40px auto;">
        <h2 class="section-heading">Create Your Account</h2>
        <p>Join FreshMart today!</p>

        <form id="registerForm">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control"
                       minlength="6" required>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" class="form-textarea" required></textarea>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                Register
            </button>

            <p id="message"></p>
        </form>

        <p style="text-align: center; margin-top: 20px;">
            Already have an account?
            <a href="/login">Login</a>
        </p>
    </div>
</main>

<script src="/js/user.js"></script>

</body>
</html>
