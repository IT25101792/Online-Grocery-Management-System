<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Products - Online Grocery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-success mb-4">
    <div class="container"><span class="navbar-brand">Online Grocery - Product &amp; Inventory</span></div>
</nav>

<div class="container">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="d-flex justify-content-between mb-3">
        <form class="d-flex" th:action="@{/products}" method="get">
            <input class="form-control me-2" name="keyword" th:value="${keyword}"
                   placeholder="Search by name or category">
            <button class="btn btn-outline-success" type="submit">Search</button>
        </form>
        <a class="btn btn-success" th:href="@{/products/add}">+ Add Product</a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle bg-white">
            <thead class="table-success">
            <tr>
                <th>ID</th><th>Name</th><th>Category</th><th>Type</th>
                <th>Price (Rs.)</th><th>Stock</th><th>Details</th><th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${products}">
                <td th:text="${p.productId}"></td>
                <td th:text="${p.name}"></td>
                <td th:text="${p.category}"></td>
                <td>
                    <span class="badge"
                          th:classappend="${p.productType == 'PERISHABLE'} ? 'bg-warning text-dark' : 'bg-secondary'"
                          th:text="${p.productType == 'PERISHABLE'} ? 'Perishable' : 'Non-perishable'"></span>
                </td>
                <td>
                    <span th:if="${p.discountedPrice != p.price}">
                        <del class="text-muted" th:text="${#numbers.formatDecimal(p.price, 1, 2)}"></del>
                        <strong class="text-danger" th:text="${#numbers.formatDecimal(p.discountedPrice, 1, 2)}"></strong>
                    </span>
                    <span th:if="${p.discountedPrice == p.price}"
                          th:text="${#numbers.formatDecimal(p.price, 1, 2)}"></span>
                </td>
                <td>
                    <span th:text="${p.stockQty}"></span>
                    <span th:if="${p.lowStock}" class="badge bg-danger">Low</span>
                </td>
                <td>
                    <span th:text="${p.productType == 'PERISHABLE'} ? ${'Expires: ' + p.expiryDate} : ${'Packaging: ' + p.packagingType}"></span>
                    <span th:if="${p.productType == 'PERISHABLE' and p.expired}" class="badge bg-dark">Expired</span>
                </td>
                <td>
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/products/edit/{id}(id=${p.productId})}">Edit</a>
                    <form class="d-inline" th:action="@{/products/delete/{id}(id=${p.productId})}" method="post"
                          onsubmit="return confirm('Delete this product?');">
                        <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(products)}">
                <td colspan="8" class="text-center text-muted">No products found</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
