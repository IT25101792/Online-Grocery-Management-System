<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Product - Online Grocery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-success mb-4">
    <div class="container"><span class="navbar-brand">Online Grocery - Product &amp; Inventory</span></div>
</nav>

<div class="container" style="max-width: 600px;">
    <div class="card shadow-sm">
        <div class="card-body">
            <h4 class="mb-3">Edit Product <span class="text-muted" th:text="'#' + ${product.productId}"></span></h4>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/products/edit/{id}(id=${product.productId})}" method="post">
                <div class="mb-3">
                    <label class="form-label">Type</label>
                    <input class="form-control" th:value="${product.productType}" disabled>
                </div>
                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input class="form-control" name="name" th:value="${product.name}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Category</label>
                    <input class="form-control" name="category" th:value="${product.category}" required>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Price (Rs.)</label>
                        <input class="form-control" type="number" step="0.01" min="0" name="price" th:value="${product.price}" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Stock quantity</label>
                        <input class="form-control" type="number" min="0" name="stockQty" th:value="${product.stockQty}" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Reorder level</label>
                        <input class="form-control" type="number" min="0" name="reorderLevel" th:value="${product.reorderLevel}" required>
                    </div>
                </div>

                <div class="mb-3" th:if="${product.productType == 'PERISHABLE'}">
                    <label class="form-label">Expiry date</label>
                    <input class="form-control" type="date" name="expiryDate" th:value="${product.expiryDate}">
                </div>
                <div class="mb-3" th:if="${product.productType == 'NON_PERISHABLE'}">
                    <label class="form-label">Packaging type</label>
                    <input class="form-control" name="packagingType" th:value="${product.packagingType}">
                </div>

                <button class="btn btn-success" type="submit">Update</button>
                <a class="btn btn-outline-secondary" th:href="@{/products}">Cancel</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
