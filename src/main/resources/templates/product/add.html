<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Product - Online Grocery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-success mb-4">
    <div class="container"><span class="navbar-brand">Online Grocery - Product &amp; Inventory</span></div>
</nav>

<div class="container" style="max-width: 600px;">
    <div class="card shadow-sm">
        <div class="card-body">
            <h4 class="mb-3">Add Product</h4>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/products/add}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="type">Product type</label>
                    <select class="form-select" id="type" name="type" required>
                        <option value="">-- Choose --</option>
                        <option value="PERISHABLE" th:selected="${type == 'PERISHABLE'}">Perishable (milk, vegetables...)</option>
                        <option value="NON_PERISHABLE" th:selected="${type == 'NON_PERISHABLE'}">Non-perishable (rice, canned food...)</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input class="form-control" name="name" th:value="${name}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Category</label>
                    <input class="form-control" name="category" th:value="${category}" required>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Price (Rs.)</label>
                        <input class="form-control" type="number" step="0.01" min="0" name="price" th:value="${price}" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Stock quantity</label>
                        <input class="form-control" type="number" min="0" name="stockQty" th:value="${stockQty}" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Reorder level</label>
                        <input class="form-control" type="number" min="0" name="reorderLevel" th:value="${reorderLevel}" required>
                    </div>
                </div>

                <div class="mb-3" id="perishableBox" style="display:none;">
                    <label class="form-label">Expiry date</label>
                    <input class="form-control" type="date" name="expiryDate" th:value="${expiryDate}">
                </div>
                <div class="mb-3" id="nonPerishableBox" style="display:none;">
                    <label class="form-label">Packaging type</label>
                    <input class="form-control" name="packagingType" th:value="${packagingType}"
                           placeholder="e.g. Bag, Can, Box">
                </div>

                <button class="btn btn-success" type="submit">Save</button>
                <a class="btn btn-outline-secondary" th:href="@{/products}">Cancel</a>
            </form>
        </div>
    </div>
</div>

<script>
    function toggleFields() {
        const t = document.getElementById('type').value;
        document.getElementById('perishableBox').style.display = (t === 'PERISHABLE') ? 'block' : 'none';
        document.getElementById('nonPerishableBox').style.display = (t === 'NON_PERISHABLE') ? 'block' : 'none';
    }
    document.getElementById('type').addEventListener('change', toggleFields);
    toggleFields();
</script>
</body>
</html>
