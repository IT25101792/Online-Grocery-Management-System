<!DOCTYPE html>
<html lang="en">
<head>
    <nav>
        <a href="/index.html">Home</a>
        <a href="/index.html">Products</a>
        <a href="/login.html">Login</a>
        <a href="/register.html">Register</a>
        <a href="#" class="cart-btn">Cart (0)</a>
    </nav>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Back - TechStore</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- Header / Navigation -->
<header>
    <div class="logo">TechStore</div>
    <nav>
        <a href="/index.html">Home</a>
        <a href="/index.html">Products</a>
        <a href="/login.html">Login</a>
        <a href="/register.html">Register</a>
        <a href="#" class="cart-btn">Cart (0)</a>
    </nav>
</header>

<!-- Login Container -->
<main class="auth-container">
    <div class="auth-card">
        <h2>Welcome Back</h2>
        <p class="auth-subtitle">Sign in to manage your orders and account.</p>

        <form id="loginForm" action="#" method="POST" onsubmit="return handleLogin(event)">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="john@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="submit-btn">Sign In</button>
        </form>

        <p class="auth-footer">
            Don't have an account? <a href="/register.html">Create one</a>
        </p>
    </div>
</main>

<!-- Footer -->
<footer>
    <p>&copy; 2026 TechStore. All rights reserved.</p>
</footer>

<!-- Form Handler Script -->
<script>
    function handleLogin(event) {
        event.preventDefault();
        const email = document.getElementById('email').value;
        alert("Logged in as " + email + " (Demo response)");
        window.location.href = "/index.html";
        return true;
    }
</script>
</body>
</html>
